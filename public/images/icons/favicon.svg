<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18042b"/>
      <stop offset="100%" stop-color="#020005"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="18" result="b2"/>
      <feGaussianBlur stdDeviation="30" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo escuro com bordas arredondadas e brilho radial sutil -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Camada do brilho Neon -->
  <path d="M156 170 h200 L256 343 Z" fill="none" stroke="#a224ff" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Camada do núcleo branco/brilhante central -->
  <path d="M156 170 h200 L256 343 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
</svg>
